<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>feicms 资源站维护面板</title>
  <style>
    :root { --bg:#0f1115; --fg:#e6e6e6; --muted:#8b939c; --card:#161a21; --line:#232a33; --ok:#3fb950; --bad:#f0606a; --slow:#d9a441; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); }
    header { padding:18px 24px; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:18px; }
    .sub { color:var(--muted); font-size:13px; margin-top:4px; }
    main { padding:20px 24px; display:grid; gap:18px; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
    .card b { display:block; font-size:20px; }
    .card span { color:var(--muted); font-size:12px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; }
    th { color:var(--muted); font-weight:600; }
    .pill { padding:2px 8px; border-radius:999px; font-size:11px; }
    .pill.ok { background:rgba(63,185,80,.15); color:var(--ok); }
    .pill.dead { background:rgba(240,96,106,.15); color:var(--bad); }
    .pill.slow { background:rgba(217,164,65,.15); color:var(--slow); }
    .pill.unknown { background:rgba(139,147,156,.15); color:var(--muted); }
    button { background:var(--card); border:1px solid var(--line); color:var(--fg); border-radius:6px; padding:6px 10px; cursor:pointer; font-size:12px; }
    button:hover { border-color:#3a4654; }
    input, select { background:var(--card); border:1px solid var(--line); color:var(--fg); border-radius:6px; padding:8px 10px; font-size:13px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .results { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; font-size:13px; white-space:pre-wrap; }
  </style>
</head>
<body>
  <header>
    <h1>feicms 资源站维护面板</h1>
    <div class="sub">采集状态、站点健康、一键采集与搜索</div>
  </header>
  <main>
    <div class="cards" id="stats"></div>

    <div class="row">
      <input id="q" placeholder="搜索视频标题…" />
      <button id="search">搜索</button>
      <button id="collect">采集全部启用站点</button>
      <button id="health">健康检查</button>
    </div>

    <div class="results" id="output">就绪。</div>

    <table id="sources">
      <thead>
        <tr><th>#</th><th>名称</th><th>URL</th><th>健康</th><th>延迟</th><th>条目</th><th>启用</th><th></th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <script>
    const api = "";
    const out = document.getElementById("output");

    async function json(url, opts) {
      const r = await fetch(url, opts);
      return r.json();
    }

    async function loadStats() {
      const s = await json(api + "/api/stats");
      document.getElementById("stats").innerHTML = `
        <div class="card"><b>${s.sources}</b><span>站点总数</span></div>
        <div class="card"><b>${s.enabled_sources}</b><span>启用站点</span></div>
        <div class="card"><b>${s.healthy_sources}</b><span>健康站点</span></div>
        <div class="card"><b>${s.videos}</b><span>视频条目</span></div>
        <div class="card"><b>${s.source_items}</b><span>采集记录</span></div>`;
    }

    async function loadSources() {
      const list = await json(api + "/api/sources");
      document.querySelector("#sources tbody").innerHTML = list.map(s => `
        <tr>
          <td>${s.id}</td>
          <td>${s.name}</td>
          <td><code>${s.url}</code></td>
          <td><span class="pill ${s.health_status}">${s.health_status}</span></td>
          <td>${s.latency_ms ?? "-"}</td>
          <td>${s.item_count}</td>
          <td>${s.enabled ? "是" : "否"}</td>
          <td>
            <button data-collect="${s.id}">采集</button>
            <button data-toggle="${s.id}" data-enabled="${s.enabled ? 0 : 1}">${s.enabled ? "禁用" : "启用"}</button>
          </td>
        </tr>`).join("");
    }

    document.addEventListener("click", async (e) => {
      const id = e.target.dataset.collect || e.target.dataset.toggle;
      if (!id) return;
      if (e.target.dataset.collect) {
        out.textContent = "采集中…";
        const r = await json(`/api/sources/${id}/collect`, { method: "POST" });
        out.textContent = JSON.stringify(r, null, 2);
      } else {
        await json(`/api/sources/${id}/enable`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ enabled: e.target.dataset.enabled === "1" }),
        });
      }
      await loadSources();
      await loadStats();
    });

    document.getElementById("search").addEventListener("click", async () => {
      const q = encodeURIComponent(document.getElementById("q").value);
      const r = await json(`/api/videos?q=${q}&limit=20`);
      out.textContent = `${r.total} 条结果\n` + r.items.map(v => `${v.id}  ${v.name}  [${v.type_name}]  ${v.source_count} 个源`).join("\n");
    });

    document.getElementById("collect").addEventListener("click", async () => {
      out.textContent = "采集全部站点…";
      const r = await json("/api/collect", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
      out.textContent = JSON.stringify(r, null, 2);
      await loadStats();
      await loadSources();
    });

    document.getElementById("health").addEventListener("click", async () => {
      out.textContent = "健康检查中…";
      const r = await json("/api/health-check", { method: "POST" });
      out.textContent = `${r.ok}/${r.checked} 正常\n` + r.results.map(x => `${x.name}: ${x.ok ? "OK" : "FAIL"} ${x.latency_ms}ms ${x.message}`).join("\n");
      await loadSources();
    });

    loadStats();
    loadSources();
  </script>
</body>
</html>

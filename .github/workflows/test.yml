name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: uv-org/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run pytest -q

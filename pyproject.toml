[project]
name = "feicms"
version = "0.1.0"
description = "Resource-site (资源站) aggregator: collect -> database -> FastAPI -> maintenance"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "curl-cffi>=0.16.3",
    "lxml>=6.1.3",
]

[project.optional-dependencies]
mysql = ["aiomysql>=0.2.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
feicms = "feicms.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["feicms"]
